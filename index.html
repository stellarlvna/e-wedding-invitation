/* Layout concept: a phone-shaped game stage. Full-bleed pixel garden, cream rounded HUD panels with gold edges, a bottom dock of six places, and a cream bottom sheet for each place. Single committed sunset-garden look, pixel art by choice. */
:root{

}
[hidden]{display:none!important}

.pick b{display:block; font-family:var(--f-px); font-size:9px; letter-spacing:.06em; margin-bottom:5px}
.pick small{display:block; font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.pick[aria-pressed="true"]{border-color:var(--maroon); box-shadow:0 0 0 2px var(--maroon)}
.pick[aria-pressed="true"]:after{content:""; position:absolute; top:-8px; right:-6px; width:22px; height:22px; border-radius:50%; background:var(--maroon) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 12.5l4 4 8-9' fill='none' stroke='white' stroke-width='3'/></svg>") center/14px no-repeat}

.start{width:100%; margin-top:16px; font-size:12px}

.sheet{position:absolute; inset:0; z-index:20; display:flex; align-items:flex-end; background:rgba(20,12,6,.58)}
.card{width:100%; max-height:86%; overflow:auto; background:var(--cream); color:var(--ink); border:3px solid #d8b873; border-bottom:0; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px)); box-shadow:inset 0 0 0 3px #fff9e8; color-scheme:light; animation:rise .22s steps(4)}

.seg{display:flex; gap:8px; flex-wrap:wrap}

/* ----- Mencari laluan ----- */
function los(a,b){ const d=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.max(1,Math.ceil(d/5)); for(let i=1;i<n;i++){ const t=i/n; if(blockedSafe(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)) return false; } return true; }
function planRoute(wx,wy,spotId){
  const sx=Math.max(0,Math.min(GW-1,Math.floor(player.x/CELL))), sy=Math.max(0,Math.min(GH-1,Math.floor(player.y/CELL)));
  const dist=new Int32Array(GW*GH).fill(-1), prev=new Int32Array(GW*GH).fill(-1);
  const q=[sy*GW+sx]; dist[q[0]]=0;
  const D4=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let h=0;h<q.length;h++){
    const c=q[h], cx=c%GW, cy=(c/GW)|0;
    for(const d of D4){
      const nx=cx+d[0], ny=cy+d[1]; if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      const ni=ny*GW+nx; if(!nav[ni]||dist[ni]>=0) continue;
      dist[ni]=dist[c]+1; prev[ni]=c; q.push(ni);
    }
  }
  const gx=Math.max(0,Math.min(GW-1,Math.floor(wx/CELL))), gy=Math.max(0,Math.min(GH-1,Math.floor(wy/CELL)));
  let best=-1, bs=1e9;
  for(let i=0;i<q.length;i++){ const c=q[i], cx=c%GW, cy=(c/GW)|0, s=(Math.abs(cx-gx)+Math.abs(cy-gy))*1000+dist[c]; if(s<bs){ bs=s; best=c; } }
  route.length=0; routeSpot=null;
  if(best<0) return;
  const cells=[]; for(let c=best;c>=0&&c!==sy*GW+sx;c=prev[c]) cells.push([(c%GW)*CELL+CELL/2,((c/GW)|0)*CELL+CELL/2]);
  cells.reverse();
  let pts=[[player.x,player.y]].concat(cells);
  if(spotId){ const sp=SPOTS.find(z=>z.id===spotId); if(sp&&Math.abs((best%GW)-Math.floor(sp.cx/CELL))<=1&&Math.abs(((best/GW)|0)-Math.floor(sp.cy/CELL))<=1){ pts.push([sp.cx,sp.cy]); routeSpot=spotId; } }
  const out=[]; let i=0;
  while(i<pts.length-1){ let j=pts.length-1; while(j>i+1&&!los(pts[i],pts[j])) j--; out.push(pts[j]); i=j; }
  out.forEach(p=>route.push(p));
}
function nearSpot(){
  let best=null, bd=1e9;
  SPOTS.forEach(s=>{
    const z=s.zone;
    if(player.x>=z[0]-10&&player.x<=z[2]+10&&player.y>=z[1]-10&&player.y<=z[3]+10){ const d=Math.hypot(player.x-s.cx,player.y-s.cy); if(d<bd){ bd=d; best=s; } }
  });
  return best;
}
function walkTo(spotId){
  if(dialogOpen||!state.started) return;
  const s=SPOTS.find(z=>z.id===spotId); if(!s) return;
  const ns=nearSpot(); if(ns&&ns.id===spotId){ openSpot(s); return; }
  planRoute(s.cx,s.cy,spotId);
}

/* ================= Kemas kini ================= */
const SPEED=210;
function update(dt){
  const s=dt/1000;
  if(state.started&&!dialogOpen){
    let vx=joy.x, vy=joy.y;
    if(keys.left) vx-=1; if(keys.right) vx+=1; if(keys.up) vy-=1; if(keys.down) vy+=1;
    let m=Math.hypot(vx,vy);
    if(m>1){ vx/=m; vy/=m; m=1; }
    if(m>0.05){ route.length=0; routeSpot=null; }
    else if(route.length){
      const t=route[0], dx=t[0]-player.x, dy=t[1]-player.y, d=Math.hypot(dx,dy);
      if(d<3){ route.shift(); if(!route.length&&routeSpot){ const sp=SPOTS.find(z=>z.id===routeSpot); routeSpot=null; if(sp) openSpot(sp); } }
      else { vx=dx/d; vy=dy/d; m=1; }
    }
    player.moving=m>0.05;
    if(player.moving){
      const ox=player.x, oy=player.y;
      tryMoveWith(blocked,player,vx*SPEED*s,vy*SPEED*s);
      if(route.length){ if(Math.abs(player.x-ox)+Math.abs(player.y-oy)<0.01){ player.stuck=(player.stuck||0)+dt; if(player.stuck>400){ route.length=0; routeSpot=null; player.stuck=0; } } else player.stuck=0; }
      if(Math.abs(vx)>Math.abs(vy)) player.dir=vx>0?'right':'left'; else player.dir=vy>0?'down':'up';
      player.wt+=dt;
      if(player.wt>150){ player.wt=0; player.leg^=1; if(sfxOn) tone(player.leg?150:125,0.035,0,'triangle',0.012); }
    }
  }
  guests.forEach((q,i)=>{
    q.wait-=s;
    if(q.wait<=0&&!q.moving){
      const sd=Math.floor(performance.now()/1000), a=rnd(i,sd,500)*6.28, r=20+rnd(i,sd+7,501)*70;
      q.tx=q.hx+Math.cos(a)*r; q.ty=q.hy+Math.sin(a)*r*0.4; q.moving=true;
    }
    if(q.moving){
      const dx=q.tx-q.x, dy=q.ty-q.y, d=Math.hypot(dx,dy);
      if(d<3){ q.moving=false; q.wait=2+rnd(i,Math.floor(performance.now()/1000),502)*4; }
      else {
        const ox=q.x, oy=q.y;
        tryMoveWith(gblocked,q,dx/d*70*s,dy/d*70*s);
        if(Math.abs(q.x-ox)+Math.abs(q.y-oy)<0.01){ q.moving=false; q.wait=1; }
        q.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
        q.wt+=dt; if(q.wt>230){ q.wt=0; q.leg^=1; }
      }
    }
  });
  for(let i=bubbles.length-1;i>=0;i--){ bubbles[i].t-=s; if(bubbles[i].t<=0) bubbles.splice(i,1); }
  const vw=view.w/view.z, vh=view.h/view.z;
  let tx,ty;
  if(cam.follow){ tx=player.x-vw/2; ty=player.y-vh*0.47; } else { tx=(IW-vw)/2; ty=40; }
  tx=Math.max(0,Math.min(IW-vw,tx)); ty=Math.max(0,Math.min(IH-vh,ty));
  const k=reduce?1:Math.min(1,dt/200);
  cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k;
  abtn.classList.toggle('ready',!!(state.started&&!dialogOpen&&nearSpot()));
}

function render(t){

  /* watak */

  guests.forEach(q=>items.push({y:q.y,fn:()=>drawPerson(q.x,q.y,q.dir,q.leg,q.moving,q.pal)}));
  items.sort((a,c)=>a.y-c.y).forEach(i=>i.fn());
  bubbles.forEach(drawBubble);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(255,170,70,.06)'; ctx.fillRect(0,0,W,H);
  if(vignette){ ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H); }
}

/* ================= Bunyi dan muzik ================= */
let ac=null, musicOn=true, sfxOn=true, mtimer=null, nextT=0, mstep=0;
function ensureAudio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
  if(ac&&ac.state==='suspended') ac.resume().catch(()=>{});
}
function tone(f,d,t0,type,v){
  if(!ac||!sfxOn) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain(), s=ac.currentTime+(t0||0);
    o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(v||0.04,s); g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+d+0.03);
  }catch(e){}
}
function note(f,t,d,type,v){
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }catch(e){}
}
const mtof=n=>440*Math.pow(2,(n-69)/12);
const MELODY=[72,0,76,0,79,76,0,74, 72,0,69,0,67,0,69,72, 74,0,77,0,76,74,0,72, 71,0,72,0,67,0,0,0];
const BASSN=[48,45,41,43];
function musicTick(){
  if(!ac||!musicOn) return;
  while(nextT<ac.currentTime+0.35){
    const m=MELODY[mstep];
    if(m) note(mtof(m),nextT,0.5,'triangle',0.045);
    if(mstep%8===0) note(mtof(BASSN[mstep/8]),nextT,1.0,'sine',0.06);
    if(mstep%8===4) note(mtof(BASSN[(mstep-4)/8]+7),nextT,0.5,'sine',0.035);
    nextT+=0.29; mstep=(mstep+1)%32;
  }
}
function startMusic(){ ensureAudio(); if(!ac||mtimer) return; nextT=ac.currentTime+0.05; mtimer=setInterval(musicTick,120); }
function stopMusic(){ if(mtimer){ clearInterval(mtimer); mtimer=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopMusic(); else if(musicOn&&state.started) startMusic(); });
function chime(){ [659,784,988].forEach((f,i)=>tone(f,0.16,i*0.09)); }
function fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.18,i*0.11)); }

function joyMove(e){
  const r=joyEl.getBoundingClientRect(), max=r.width/2-8;
  let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy); if(d>max){ dx*=max/d; dy*=max/d; }
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  const m=Math.hypot(dx,dy)/max;
  if(m<0.2){ joy.x=0; joy.y=0; } else { joy.x=dx/max; joy.y=dy/max; }
}
function joyEnd(){ joyId=null; joy.x=0; joy.y=0; knob.style.transform=''; }
joyEl.addEventListener('pointerdown',e=>{ if(dialogOpen) return; e.preventDefault(); ensureAudio(); joyId=e.pointerId; try{ joyEl.setPointerCapture(e.pointerId); }catch(x){} route.length=0; routeSpot=null; joyMove(e); });
joyEl.addEventListener('pointermove',e=>{ if(e.pointerId===joyId) joyMove(e); });
joyEl.addEventListener('pointerup',e=>{ if(e.pointerId===joyId) joyEnd(); });
joyEl.addEventListener('pointercancel',e=>{ if(e.pointerId===joyId) joyEnd(); });
joyEl.addEventListener('lostpointercapture',joyEnd);

const KEYMAP={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
document.addEventListener('keydown',e=>{
  if(dialogOpen||!state.started||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.length===1?e.key.toLowerCase():e.key, d=KEYMAP[k];
  if(d){ e.preventDefault(); ensureAudio(); keys[d]=true; return; }
  if((e.key===' '||e.key==='Enter'||k==='e')&&document.activeElement===document.body){ e.preventDefault(); interact(); }
});
document.addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key, d=KEYMAP[k]; if(d) keys[d]=false; });
window.addEventListener('blur',()=>{ Object.keys(keys).forEach(k=>{ keys[k]=false; }); });
cv.addEventListener('click',e=>{
  if(dialogOpen||!state.started) return;
  ensureAudio();
  const r=cv.getBoundingClientRect();
  const wx=cam.x+(e.clientX-r.left)/view.z, wy=cam.y+(e.clientY-r.top)/view.z;
  const hit=SPOTS.find(s=>Math.hypot(wx-s.cx,wy-(s.cy-70))<85);
  if(hit){ walkTo(hit.id); return; }
  planRoute(wx,wy,null);
});

/* ================= Skrin pengenalan ================= */
const nameIn=$('#guest-name');
nameIn.value=state.name;
function syncName(){ const v=nameIn.value.trim(); $('#to-name').textContent=v||'Tetamu Istimewa'; }
syncName();
nameIn.addEventListener('input',syncName);
function drawPreview(id,pal){ const c=$(id).getContext('2d'); c.clearRect(0,0,16,17); person(c,0,2,'down',0,false,pal); }
function setGender(g){
  state.gender=g;
  $('#pick-m').setAttribute('aria-pressed',String(g==='m')); $('#pick-f').setAttribute('aria-pressed',String(g==='f'));
}
$('#pick-m').addEventListener('click',()=>setGender('m'));
$('#pick-f').addEventListener('click',()=>setGender('f'));
setGender(state.gender);
function drawPreviews(){ drawPreview('#pv-m',PAL.m); drawPreview('#pv-f',PAL.f); }
drawPreviews();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ drawPreviews(); });
$('#start').addEventListener('click',()=>{
  state.name=nameIn.value.trim().slice(0,40);
  try{ localStorage.setItem('nz-gender-v1',state.gender); localStorage.setItem('nz-name-v1',state.name); }catch(e){}
  state.started=true; cam.follow=true;
  $('#intro').hidden=true; $('#hud').hidden=false;
  renderDock(); renderQuest(); ensureAudio();
  if(musicOn) startMusic();
  chime();
  toast('Selamat datang'+(state.name?', '+state.name:'')+'! Ikut hati merah atau tekan menu di bawah.');
  abtn.focus({preventScroll:true}); abtn.blur();
});

/* ================= Mula ================= */
new ResizeObserver(resize).observe(app);
resize();
let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last); last=now;
  update(dt); render(now/1000);
  requestAnimationFrame(loop);
}
renderDock(); renderQuest();
requestAnimationFrame(loop);
})();
</script>
